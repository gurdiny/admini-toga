# Compila la imagen de producción y la publica en GitHub Container Registry.
# El VPS no compila nada (3 núcleos y n8n en producción): solo descarga.
#
#   ghcr.io/gurdiny/admini-toga:sha-abc1234 cada commit: es el que usa producción
#   ghcr.io/gurdiny/admini-toga:latest      último commit de main (referencia; producción no lo usa)
#
# Con la imagen publicada, el job «deploy» entra al VPS con una llave que solo
# puede correr deploy/auto-deploy.sh (respaldo → nueva versión → healthy, o
# regresa a la anterior). Ver docs/DEPLOY.md, «3. Actualizar».
# Si un push nuevo cancela esta ejecución a medio deploy, el VPS lo termina
# igual y el deploy siguiente espera su turno.
name: Imagen Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  image:
    name: Compilar y publicar
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en producción
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://admin.toga.mx
    steps:
      - name: Desplegar en el VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # La llave solo puede correr auto-deploy.sh; lo único que se manda es el tag.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "root@$HOST" "sha-${GITHUB_SHA::7}"
      - name: Verificar que responde
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors https://admin.toga.mx/api/health
