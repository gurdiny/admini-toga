# Plantilla del servicio Compose de TOGA en Easypanel.
#
# NO se pega tal cual: Easypanel no pasa las variables de su pestaña
# Environment al compose (llegan vacías). `deploy/render.sh` la llena con los
# valores de /opt/toga-app/.env.production y el resultado es lo que se pega
# en Easypanel. Ver docs/DEPLOY.md.
#
# - Nombres únicos (toga-app, toga-db): la app también queda en la red de
#   Traefik, donde otro servicio podría llamarse "db".
# - Postgres sin `ports`: solo se alcanza por la red interna del compose.
# - Rutas absolutas: Easypanel ejecuta el compose desde otro directorio.
services:
  toga-app:
    image: ghcr.io/gurdiny/admini-toga:${TOGA_IMAGE_TAG}
    # La imagen es privada: la descarga root en el VPS con su token de solo
    # lectura (docker pull). Easypanel nunca la baja por su cuenta, solo usa
    # la que ya está en el servidor.
    pull_policy: never
    container_name: toga-app
    restart: unless-stopped
    depends_on:
      toga-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://toga:${POSTGRES_PASSWORD}@toga-db:5432/toga?schema=public"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "https://${APP_DOMAIN}"
      APP_TIMEZONE: "America/Mexico_City"
    expose:
      - "3000"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  toga-db:
    image: postgres:17-alpine
    container_name: toga-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: toga
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: toga
      TZ: UTC
      PGTZ: UTC
    volumes:
      - /opt/toga-app/postgres:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toga -d toga"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
